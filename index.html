/* ---------- helpers ---------- */
var $=function(id){return document.getElementById(id);};
var BY={};
CATS.forEach(function(c){c.items.forEach(function(it,i){it.id=c.id+'-'+i;BY[it.id]={it:it,c:c};});});
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function norm(s){return String(s).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();}
function money(n){return n.toLocaleString('en-US')+' ج';}

/* ---------- menu render ---------- */
function chips(it){
  if(it.o.length===1) return '<div class="chips"><span class="chip one">'+money(it.o[0][1])+'</span></div>';
  return '<div class="chips">'+it.o.map(function(o){return '<span class="chip"><i>'+esc(o[0])+'</i>'+o[1]+'</span>';}).join('')+'</div>';
}
function needsSheet(c,it){return it.o.length>1||c.ex.length>0;}
function renderMenu(){
  var q=norm($('q').value.trim());
  var html='',tabs='',shown=0;
  CATS.forEach(function(c){
    var list=c.items.filter(function(it){return !q||norm(it.n+' '+it.d+' '+c.t+' '+c.s).indexOf(q)>-1;});
    if(!list.length) return;
    shown+=list.length;
    tabs+='<button class="tab" type="button" data-cat="'+c.id+'">'+esc(c.t)+'</button>';
    html+='<section class="cat" id="c-'+c.id+'" data-cat="'+c.id+'"><div class="cat-head">'+(IMG[c.id]?'<img class="ph" alt="" src="'+IMG[c.id]+'">':'')+'<div class="cat-t"><h2>'+esc(c.t)+'</h2>'+(c.note?'<p class="note">'+esc(c.note)+'</p>':'')+'</div></div><div class="items">'+
      list.map(function(it){
        return '<article class="item"><div style="min-width:0"><h3>'+esc(it.n)+'</h3>'+(it.d?'<p class="d">'+esc(it.d)+'</p>':'')+chips(it)+'</div><button class="add" type="button" data-id="'+it.id+'">'+(needsSheet(c,it)?'اختر':'أضف')+'</button></article>';
      }).join('')+'</div></section>';
  });
  $('menu').innerHTML=shown?html:'<p class="empty">مفيش صنف بالاسم ده. جرّب كلمة تانية.</p>';
  $('tabs').innerHTML=tabs;
  spy();
}
function setHH(){document.documentElement.style.setProperty('--hh',$('top').offsetHeight+'px');}
function spy(){
  var hh=$('top').offsetHeight+24,cur=null;
  document.querySelectorAll('.cat').forEach(function(s){if(s.getBoundingClientRect().top<=hh)cur=s.dataset.cat;});
  if(!cur){var f=document.querySelector('.cat');cur=f?f.dataset.cat:null;}
  document.querySelectorAll('.tab').forEach(function(t){
    var on=t.dataset.cat===cur;
    if(on&&t.getAttribute('aria-current')!=='true'){t.setAttribute('aria-current','true');var box=$('tabs');var tr=t.getBoundingClientRect(),br=box.getBoundingClientRect();if(tr.left<br.left||tr.right>br.right){box.scrollLeft+=(tr.left+tr.width/2)-(br.left+br.width/2);}}
    else if(!on){t.removeAttribute('aria-current');}
  });
}

/* ---------- cart ---------- */
var cart=[];
try{cart=JSON.parse(localStorage.getItem('hp-cart')||'[]');if(!Array.isArray(cart))cart=[];}catch(e){cart=[];}
function persist(){try{localStorage.setItem('hp-cart',JSON.stringify(cart));}catch(e){}}
function afterOrder(){setTimeout(function(){cart=[];persist();renderLines();renderBar();$('cnote').value='';},400);}
function lineTotal(l){return (l.p+l.ex.reduce(function(s,e){return s+e[1];},0))*l.q;}
function cartTotal(){return cart.reduce(function(s,l){return s+lineTotal(l);},0);}
function cartCount(){return cart.reduce(function(s,l){return s+l.q;},0);}
function addLine(l){
  var f=cart.filter(function(x){return x.k===l.k;})[0];
  if(f)f.q+=l.q;else cart.push(l);
  persist();renderBar();
}
function renderBar(){
  var n=cartCount();
  $('cnt').textContent=n;
  $('bar').hidden=n===0;
  $('barL').textContent='عرض السلة · '+n+(n===1?' صنف':' أصناف');
  $('barT').textContent=money(cartTotal());
}
function lineSub(l){
  var a=[];if(l.ol)a.push(l.ol);
  if(l.ex.length)a.push('+ '+l.ex.map(function(e){return e[0];}).join('، '));
  return a.join(' · ');
}
function renderLines(){
  var box=$('lines');
  if(!cart.length){box.innerHTML='<p class="empty">السلة فاضية. اختار أصناف من المنيو.</p>';}
  else box.innerHTML=cart.map(function(l,i){
    return '<div class="ln"><div style="min-width:0"><b>'+esc(l.n)+'</b>'+(lineSub(l)?'<span class="sub">'+esc(lineSub(l))+'</span>':'')+(l.note?'<span class="sub">ملاحظة: '+esc(l.note)+'</span>':'')+'</div><div class="side"><div class="step"><button type="button" data-a="dec" data-i="'+i+'" aria-label="نقص">−</button><span>'+l.q+'</span><button type="button" data-a="inc" data-i="'+i+'" aria-label="زوّد">+</button></div><span class="lt">'+money(lineTotal(l))+'</span></div></div>';
  }).join('');
  $('sum').textContent=money(cartTotal());
  $('send').style.opacity=cart.length?'':'.5';
}

/* ---------- overlays ---------- */
var openCount=0;
function show(el){el.hidden=false;document.documentElement.style.overflow='hidden';}
function hide(el){el.hidden=true;if($('sheet').hidden&&$('cart').hidden)document.documentElement.style.overflow='';}

/* ---------- item sheet ---------- */
var cur=null;
function openSheet(id){
  var r=BY[id];cur={it:r.it,c:r.c,oi:0,ex:{},q:1};
  var it=r.it,c=r.c,h='';
  h+='<div class="p-head"><div><h3 id="sTitle">'+esc(it.n)+'</h3>'+(it.d?'<p>'+esc(it.d)+'</p>':'')+'</div><button class="x" type="button" data-close aria-label="إغلاق">×</button></div>';
  if(it.o.length>1){
    h+='<fieldset><legend>اختار الحجم</legend>'+it.o.map(function(o,i){return '<label class="opt"><input type="radio" name="osz" value="'+i+'"'+(i===0?' checked':'')+'><span>'+esc(o[0])+'</span><span class="pr">'+money(o[1])+'</span></label>';}).join('')+'</fieldset>';
  }
  if(c.ex.length){
    h+='<fieldset><legend>إضافات (اختياري)</legend>'+c.ex.map(function(e,i){return '<label class="opt"><input type="checkbox" name="oex" value="'+i+'"><span>'+esc(e[0])+'</span><span class="pr">+ '+money(e[1])+'</span></label>';}).join('')+'</fieldset>';
  }
  h+='<label class="fld"><span>ملاحظات (اختياري)</span><input id="snote" type="text" placeholder="مثال: من غير بصل"></label>';
  h+='<div class="foot"><div class="step"><button type="button" id="qm" aria-label="نقص">−</button><span id="qn">1</span><button type="button" id="qp" aria-label="زوّد">+</button></div><button class="btn" type="button" id="sadd"></button></div>';
  $('sheetP').innerHTML=h;
  sheetTotal();
  show($('sheet'));
}
function sheetUnit(){
  var u=cur.it.o[cur.oi][1];
  Object.keys(cur.ex).forEach(function(i){if(cur.ex[i])u+=cur.c.ex[i][1];});
  return u;
}
function sheetTotal(){
  $('qn').textContent=cur.q;
  $('sadd').textContent='أضف للسلة · '+money(sheetUnit()*cur.q);
}
function commitSheet(){
  var it=cur.it,c=cur.c;
  var exs=Object.keys(cur.ex).filter(function(i){return cur.ex[i];}).map(function(i){return c.ex[i];});
  var note=$('snote').value.trim();
  var ol=it.o[cur.oi][0];
  var k=[it.id,cur.oi,exs.map(function(e){return e[0];}).join('+'),note].join('|');
  addLine({k:k,n:it.n,ol:ol,p:it.o[cur.oi][1],ex:exs,q:cur.q,note:note});
  hide($('sheet'));
}

/* ---------- order message ---------- */
function orderText(){
  var mode=document.querySelector('input[name="mode"]:checked').value;
  var L=[];
  L.push('طلب جديد من Hpizzaiolo');
  L.push('الاسم: '+$('cname').value.trim());
  L.push('الموبايل: '+$('cphone').value.trim());
  L.push('نوع الطلب: '+mode);
  if(mode==='توصيل')L.push('العنوان: '+$('caddr').value.trim());
  L.push('------------');
  cart.forEach(function(l){
    var s=l.q+' × '+l.n;
    if(l.ol)s+=' ('+l.ol+')';
    if(l.ex.length)s+=' + '+l.ex.map(function(e){return e[0];}).join(' + ');
    s+=' = '+money(lineTotal(l));
    L.push(s);
    if(l.note)L.push('   ملاحظة: '+l.note);
  });
  L.push('------------');
  L.push('الإجمالي: '+money(cartTotal())+' (بدون التوصيل)');
  var n=$('cnote').value.trim();
  if(n)L.push('ملاحظات: '+n);
  return L.join('\n');
}
function validate(){
  var m='';
  var mode=document.querySelector('input[name="mode"]:checked').value;
  if(!cart.length)m='السلة فاضية. أضف صنف الأول.';
  else if(!$('cname').value.trim())m='اكتب اسمك.';
  else if($('cphone').value.replace(/\D/g,'').length<10)m='اكتب رقم موبايل صحيح.';
  else if(mode==='توصيل'&&!$('caddr').value.trim())m='اكتب عنوان التوصيل.';
  var e=$('err');
  e.hidden=!m;e.textContent=m;
  return !m;
}

/* ---------- events ---------- */
$('menu').addEventListener('click',function(e){
  var b=e.target.closest('.add');if(!b)return;
  var r=BY[b.dataset.id];
  if(needsSheet(r.c,r.it)){openSheet(b.dataset.id);return;}
  addLine({k:r.it.id+'|0||',n:r.it.n,ol:'',p:r.it.o[0][1],ex:[],q:1,note:''});
  b.textContent='تمت الإضافة';setTimeout(function(){b.textContent='أضف';},900);
});
$('tabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(!t)return;
  var s=$('c-'+t.dataset.cat);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});
});
$('q').addEventListener('input',renderMenu);
$('sheet').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){hide($('sheet'));return;}
  var t=e.target;
  if(t.id==='qm'){if(cur.q>1)cur.q--;sheetTotal();}
  else if(t.id==='qp'){if(cur.q<50)cur.q++;sheetTotal();}
  else if(t.id==='sadd'){commitSheet();}
});
$('sheet').addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='osz')cur.oi=+t.value;
  else if(t.name==='oex')cur.ex[t.value]=t.checked;
  sheetTotal();
});
$('cartBtn').addEventListener('click',function(){renderLines();show($('cart'));});
$('barBtn').addEventListener('click',function(){renderLines();show($('cart'));});
$('cart').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){hide($('cart'));return;}
  var b=e.target.closest('[data-a]');if(!b)return;
  var i=+b.dataset.i,l=cart[i];if(!l)return;
  if(b.dataset.a==='inc'&&l.q<50)l.q++;
  else if(b.dataset.a==='dec'){l.q--;if(l.q<1)cart.splice(i,1);}
  persist();renderLines();renderBar();
